services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: digital_twin_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data

  neo4j:
    image: neo4j:5.18-community
    container_name: digital_twin_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data

  backend:
    build: ./backend
    container_name: digital_twin_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
    volumes:
      - ./data:/data
      - ./backend/app:/app/app
    depends_on:
      - mosquitto
      - neo4j

  mqtt-publisher:
    build: ./backend
    container_name: digital_twin_mqtt_publisher
    command: python3 -m app.domains.simulation.publisher --host mosquitto --port 1883 --speedup 60 --registry /data/tag_mapping_registry.csv --process-csv /data/process_flow_timeseries.csv --health-csv /data/machine_health_timeseries.csv
    volumes:
      - ./data:/data
      - ./backend/app:/app/app
    depends_on:
      - mosquitto

  frontend:
    build: ./frontend
    container_name: digital_twin_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  neo4j_data:
  mosquitto_data:
